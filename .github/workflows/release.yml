name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  ENTRY_POINT: src/oi_downloader/main.py

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64

    runs-on: ${{ matrix.os }}

    env:
      BIN: oi-downloader-${{ matrix.target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: "pyproject.toml"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build Executable
        run: >
          uv run pyinstaller --onefile --clean --noconfirm --name ${{ env.BIN }} ${{ env.ENTRY_POINT }}

      - name: Make executable and archive
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$BIN.zip" "$BIN.exe"
          else
            chmod +x "$BIN"
            COPYFILE_DISABLE=1 tar -czf "$BIN.tar.gz" "$BIN"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
