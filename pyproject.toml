[project]
name = "oi-fetcher"
version = "0.0.0"
description = "Tool for downloading your own solutions from the Szkopuł platform for the OI checklist."
readme = "README.md"
authors = [
    { name = "Mateusz Pietrowcow", email = "104150350+Matian37@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11.9",
    "roman>=5.1",
    "playwright>=1.55.0"
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
