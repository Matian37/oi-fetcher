[project]
name = "oi-downloader"
version = "0.0.0"
description = "Tool for downloading your own solutions from the Szkopuł platform for the OI checklist."
readme = "README.md"
authors = [
    { name = "Mateusz Pietrowcow", email = "104150350+Matian37@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "roman>=5.1",
    "requests>=2.32.0",
]

[project.scripts]
oi-downloader = "oi_downloader.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.0"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
